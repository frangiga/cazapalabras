<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cazapalabras Web</title>
  <style>
    :root {
      --primary: #ff6f00;
      --primary-hover: #e66400;
      --bg: #f4f1ea;
      --card-bg: #ffffff;
      --text: #2c3e50;
      --border: #dcd6cd;
      --error: #d9534f;
      --success: #27ae60;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
      box-sizing: border-box;
    }

    .container {
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      padding: 24px;
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    h1 { margin: 0 0 16px 0; font-size: 1.8rem; }

    /* Estilos del Footer */
    footer {
      margin-top: 25px;
      font-size: 0.85rem;
      color: #7f8c8d;
    }
    footer a {
      color: var(--primary);
      text-decoration: none;
      font-weight: bold;
    }
    footer a:hover { text-decoration: underline; }

    /* ... resto de estilos anteriores ... */
    .dice-container { display: flex; justify-content: center; gap: 16px; margin-bottom: 20px; }
    .die { width: 64px; height: 64px; background: #ffffff; border: 3px solid var(--text); border-radius: 12px; display: flex; justify-content: center; align-items: center; font-size: 2rem; font-weight: bold; box-shadow: 0 4px 0 var(--text); transition: transform 0.2s ease; }
    .die.highlight { border-color: var(--primary); color: var(--primary); box-shadow: 0 4px 0 var(--primary); }
    .die.shake { animation: shake 0.4s ease-in-out; }
    @keyframes shake { 0%, 100% { transform: translateY(0) rotate(0deg); } 25% { transform: translateY(-6px) rotate(-8deg); } 75% { transform: translateY(6px) rotate(8deg); } }
    .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 10px 16px; background: #eee9e0; border-radius: 8px; font-weight: bold; }
    .timer { font-size: 1.2rem; color: var(--primary); }
    .controls { display: flex; gap: 10px; margin-bottom: 20px; }
    button { background-color: var(--primary); color: white; border: none; padding: 12px 20px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: background 0.2s; flex: 1; }
    button:hover { background-color: var(--primary-hover); }
    button:disabled { background-color: #ccc; cursor: not-allowed; }
    .input-group { display: flex; gap: 10px; margin-bottom: 12px; }
    input[type="text"] { flex: 1; padding: 12px; font-size: 1rem; border: 2px solid var(--border); border-radius: 8px; outline: none; text-transform: uppercase; }
    input[type="text"]:focus { border-color: var(--primary); }
    .feedback { min-height: 24px; font-weight: bold; margin-bottom: 16px; font-size: 0.95rem; }
    .feedback.error { color: var(--error); }
    .feedback.success { color: var(--success); }
    .word-list { list-style: none; padding: 0; margin: 0; max-height: 180px; overflow-y: auto; border-top: 2px solid var(--bg); padding-top: 10px; display: flex; flex-wrap: wrap; gap: 8px; }
    .word-tag { background: #eef7f2; border: 1px solid var(--success); color: #1e7e34; padding: 6px 12px; border-radius: 16px; font-size: 0.9rem; font-weight: 500; }
  </style>
</head>
<body>

<div class="container">
  <h1>Cazapalabras</h1>

  <div class="dice-container">
    <div class="die highlight" id="die1">?</div>
    <div class="die" id="die2">?</div>
    <div class="die" id="die3">?</div>
  </div>

  <div class="status-bar">
    <span>Tiempo: <span class="timer" id="timer">60</span>s</span>
    <span>Aciertos: <span id="score">0</span></span>
  </div>

  <div class="controls">
    <button id="roll-btn" onclick="iniciarTurno()">Tirar dados</button>
  </div>

  <div class="input-group">
    <input type="text" id="word-input" placeholder="Escribe tu palabra..." disabled autocomplete="off">
    <button id="submit-btn" onclick="validarPalabra()" disabled>Enviar</button>
  </div>

  <div class="feedback" id="feedback"></div>

  <ul class="word-list" id="word-list"></ul>

  <footer>
    Creado por <a href="https://instagram.com/fran_giga" target="_blank">fran_giga</a>
  </footer>
</div>

<script>
  // Caras de los dados
  const dadoVocales = ['A', 'E', 'O', 'I', 'U', 'E'];
  const dadoConsonantes1 = ['S', 'R', 'N', 'L', 'T', 'D'];
  const dadoConsonantes2 = ['C', 'M', 'P', 'B', 'G', 'V'];

  let letrasActuales = [];
  let palabrasAceptadas = new Set();
  let tiempoRestante = 60;
  let temporizador = null;
  let enJuego = false;

  const elDie1 = document.getElementById('die1');
  const elDie2 = document.getElementById('die2');
  const elDie3 = document.getElementById('die3');
  const elTimer = document.getElementById('timer');
  const elScore = document.getElementById('score');
  const elInput = document.getElementById('word-input');
  const elSubmitBtn = document.getElementById('submit-btn');
  const elRollBtn = document.getElementById('roll-btn');
  const elFeedback = document.getElementById('feedback');
  const elWordList = document.getElementById('word-list');

  elInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') validarPalabra(); });

  function tirarDados() {
    const d1 = dadoVocales[Math.floor(Math.random() * dadoVocales.length)];
    const d2 = dadoConsonantes1[Math.floor(Math.random() * dadoConsonantes1.length)];
    const d3 = dadoConsonantes2[Math.floor(Math.random() * dadoConsonantes2.length)];

    [elDie1, elDie2, elDie3].forEach(d => { d.classList.add('shake'); });
    setTimeout(() => [elDie1, elDie2, elDie3].forEach(d => d.classList.remove('shake')), 400);

    elDie1.textContent = d1;
    elDie2.textContent = d2;
    elDie3.textContent = d3;
    return [d1, d2, d3];
  }

  function iniciarTurno() {
    clearInterval(temporizador);
    palabrasAceptadas.clear();
    elWordList.innerHTML = '';
    elScore.textContent = '0';
    elFeedback.textContent = '';
    letrasActuales = tirarDados();
    tiempoRestante = 60;
    elTimer.textContent = tiempoRestante;
    enJuego = true;
    elInput.disabled = false;
    elSubmitBtn.disabled = false;
    elRollBtn.textContent = 'Nueva tirada';
    elInput.value = '';
    elInput.focus();

    temporizador = setInterval(() => {
      tiempoRestante--;
      elTimer.textContent = tiempoRestante;
      if (tiempoRestante <= 0) finalizarTurno('¡Tiempo agotado!');
    }, 1000);
  }

  function finalizarTurno(mensaje) {
    clearInterval(temporizador);
    enJuego = false;
    elInput.disabled = true;
    elSubmitBtn.disabled = true;
    elFeedback.textContent = mensaje + ` Total: ${palabrasAceptadas.size} palabras.`;
    elFeedback.className = 'feedback error';
  }

  function normalizar(texto) { return texto.toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim(); }

  async function validarPalabra() {
    if (!enJuego) return;
    const palabra = normalizar(elInput.value);
    if (!palabra) return;

    if (palabrasAceptadas.has(palabra)) {
      elFeedback.textContent = `¡Ya has usado "${palabra}"!`;
      elFeedback.className = 'feedback error';
      elInput.value = '';
      return;
    }

    const letrasPalabra = palabra.split('');
    const contieneTodas = letrasActuales.every(letra => {
      const idx = letrasPalabra.indexOf(letra);
      if (idx !== -1) { letrasPalabra.splice(idx, 1); return true; }
      return false;
    });

    if (!contieneTodas) {
      elFeedback.textContent = `Debe contener las letras: ${letrasActuales.join(', ')}`;
      elFeedback.className = 'feedback error';
    } else {
      palabrasAceptadas.add(palabra);
      elScore.textContent = palabrasAceptadas.size;
      const tag = document.createElement('li');
      tag.className = 'word-tag';
      tag.textContent = palabra;
      elWordList.prepend(tag);
      elFeedback.textContent = '¡Palabra válida!';
      elFeedback.className = 'feedback success';
    }
    elInput.value = '';
    elInput.focus();
  }
</script>

</body>
</html>
